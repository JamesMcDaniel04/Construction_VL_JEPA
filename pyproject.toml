[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-triage-copilot"
version = "0.1.0"
description = "Vision-language maintenance triage copilot for industrial electrical panels"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "alembic>=1.13.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
    "torch>=2.3.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.10.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
timm = [
    "timm>=0.9.0",
    "torchvision>=0.18.0",
]
video = [
    "opencv-python>=4.8.0",
]
video-decord = [
    "decord>=0.6.0",
]
pdf = [
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
]

[project.scripts]
mtc-api = "maintenance_triage_copilot.api.main:run"
mtc-db-upgrade = "maintenance_triage_copilot.storage.migrations:main"
mtc-train-adapter = "maintenance_triage_copilot.training.train_adapter:main"
mtc-train-policy = "maintenance_triage_copilot.training.train_policy:main"
mtc-validate-model-assets = "maintenance_triage_copilot.models.validate_assets:main"
mtc-eval-triage = "maintenance_triage_copilot.evaluation.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises external systems such as docker-compose stacks",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "PIL",
    "PIL.*",
    "cv2",
    "decord",
    "fitz",
    "pdfplumber",
    "pytesseract",
    "boto3",
    "botocore.*",
    "opentelemetry.*",
    "prometheus_client",
    "timm",
    "torchvision.*",
]
ignore_missing_imports = true
