runtime:
  mode: "production"
  model_dir: "/models"
  allow_smoke_assets: false
  max_image_upload_bytes: 5242880
  max_video_upload_bytes: 52428800
  max_document_upload_bytes: 20971520

# Production config — uses vendored Meta JEPA backbone slices and mounted model assets.

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: []  # restrict in production — set to your dashboard domain

database:
  postgres_url: "postgresql://mtc:mtc@postgres:5432/mtc"
  qdrant_url: "http://qdrant:6333"
  collection_prefix: "maintenance-triage"
  run_migrations_on_startup: true

policy:
  checkpoint_path: "/models/triage-policy.json"
  require_checkpoint: true
  top_k_issues: 3

security:
  service_tokens: {}
  require_auth_in_production: true

telemetry:
  prometheus_enabled: true
  otlp_endpoint: null
  service_name: "maintenance-triage-copilot"

object_store:
  endpoint_url: "http://minio:9000"
  bucket: "mtc-assets"
  region: "us-east-1"
  access_key: null
  secret_key: null
  force_path_style: true
  required_in_production: true
  create_bucket_if_missing: true

text_encoder:
  backend: "sentence-transformer"
  model_name: "/models/text-encoder"
  embedding_dim: 384
  local_files_only: true
  cache_folder: null

adapter:
  hidden_dim: 384
  output_dim: 384
  checkpoint_path: "/models/projector.pt"

image_backbone:
  preset: "ijepa_vith14_224"
  require_checkpoint: true
  use_timm: false
  checkpoint_path: "/models/image_backbone.pt"

video_backbone:
  preset: "vjepa_vith16_224_2x16x16"
  require_checkpoint: true
  use_timm: false
  checkpoint_path: "/models/video_backbone.pt"
