runtime:
  mode: "development"

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

database:
  postgres_url: "postgresql://mtc:mtc@localhost:5432/mtc"
  qdrant_url: "http://localhost:6333"
  collection_prefix: "maintenance-triage"
  run_migrations_on_startup: true

retrieval:
  top_k_documents: 5
  top_k_incidents: 3
  top_k_states: 3
  chunk_size: 320
  chunk_overlap: 40

triage:
  top_k_steps: 3
  state_match_threshold: 0.82
  escalation_threshold: 0.55
  video_num_frames: 8

policy:
  checkpoint_path: null
  require_checkpoint: false
  top_k_issues: 3

text_encoder:
  backend: "sentence-transformer"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  local_files_only: false
  cache_folder: null

adapter:
  hidden_dim: 384
  output_dim: 384
  checkpoint_path: null

# Image backbone — vendored Meta I-JEPA slice by default.
# Optional timm mode remains available for local experimentation.
image_backbone:
  use_timm: false
  timm_model_name: "vit_tiny_patch16_224"
  timm_pretrained: true
  checkpoint_path: null
  input_size: 64
  patch_size: 8
  embed_dim: 192
  depth: 4
  num_heads: 3

# Video backbone — vendored Meta V-JEPA slice by default.
# Optional timm mode remains available for local experimentation.
video_backbone:
  use_timm: false
  timm_model_name: "vit_tiny_patch16_224"
  timm_pretrained: true
  checkpoint_path: null
  input_size: 64
  patch_size: 8
  num_frames: 8
  tubelet_size: 2
  embed_dim: 192
  depth: 4
  num_heads: 3
