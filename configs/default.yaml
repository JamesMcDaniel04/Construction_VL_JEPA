runtime:
  mode: "development"
  model_dir: "./models"
  allow_smoke_assets: false
  max_image_upload_bytes: 5242880
  max_video_upload_bytes: 52428800
  max_document_upload_bytes: 20971520

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

database:
  postgres_url: "postgresql://mtc:mtc@localhost:5432/mtc"
  qdrant_url: "http://localhost:6333"
  collection_prefix: "maintenance-triage"
  run_migrations_on_startup: true

retrieval:
  top_k_documents: 5
  top_k_incidents: 3
  top_k_states: 3
  chunk_size: 320
  chunk_overlap: 40

triage:
  top_k_steps: 3
  state_match_threshold: 0.82
  escalation_threshold: 0.55
  video_num_frames: 8

policy:
  checkpoint_path: null
  require_checkpoint: false
  top_k_issues: 3

security:
  service_tokens: {}
  require_auth_in_production: true

supabase:
  project_url: null
  anon_key: null
  service_role_key: null
  jwt_issuer: null
  jwt_audience: null
  mobile_redirect_scheme: "mtc://auth/callback"
  web_redirect_url: "http://localhost:5173/auth/callback"

telemetry:
  prometheus_enabled: true
  otlp_endpoint: null
  service_name: "maintenance-triage-copilot"

object_store:
  endpoint_url: null
  bucket: null
  region: null
  access_key: null
  secret_key: null
  force_path_style: true
  required_in_production: true
  create_bucket_if_missing: true

text_encoder:
  backend: "sentence-transformer"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  local_files_only: false
  cache_folder: null

adapter:
  hidden_dim: 384
  output_dim: 384
  checkpoint_path: null

# Image backbone — vendored Meta I-JEPA slice by default.
# Optional timm mode remains available for local experimentation.
image_backbone:
  preset: null
  require_checkpoint: false
  use_timm: false
  timm_model_name: "vit_tiny_patch16_224"
  timm_pretrained: true
  checkpoint_path: null
  input_size: 64
  patch_size: 8
  embed_dim: 192
  depth: 4
  num_heads: 3

# Video backbone — vendored Meta V-JEPA slice by default.
# Optional timm mode remains available for local experimentation.
video_backbone:
  preset: null
  require_checkpoint: false
  use_timm: false
  timm_model_name: "vit_tiny_patch16_224"
  timm_pretrained: true
  checkpoint_path: null
  input_size: 64
  patch_size: 8
  num_frames: 8
  tubelet_size: 2
  embed_dim: 192
  depth: 4
  num_heads: 3
