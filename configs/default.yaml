api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

database:
  postgres_url: "postgresql://mtc:mtc@localhost:5432/mtc"
  qdrant_url: null
  collection_prefix: "maintenance-triage"

retrieval:
  top_k_documents: 5
  top_k_incidents: 3
  top_k_states: 3
  chunk_size: 320
  chunk_overlap: 40

triage:
  top_k_steps: 3
  state_match_threshold: 0.82
  escalation_threshold: 0.55
  video_num_frames: 8

text_encoder:
  backend: "sentence-transformer"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384

adapter:
  hidden_dim: 384
  output_dim: 384

image_backbone:
  input_size: 64
  patch_size: 8
  embed_dim: 192
  depth: 4
  num_heads: 3

video_backbone:
  input_size: 64
  patch_size: 8
  num_frames: 8
  tubelet_size: 2
  embed_dim: 192
  depth: 4
  num_heads: 3
