services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mtc
      POSTGRES_PASSWORD: mtc
      POSTGRES_DB: mtc
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtc"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MTC_MINIO_PORT:-9000}:9000"
    tmpfs:
      - /data

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      MTC_CONFIG: ${MTC_CONFIG:-/app/configs/production.yaml}
      MTC_OBJECT_STORE_ACCESS_KEY: ${MTC_OBJECT_STORE_ACCESS_KEY:-minioadmin}
      MTC_OBJECT_STORE_SECRET_KEY: ${MTC_OBJECT_STORE_SECRET_KEY:-minioadmin}
      MTC_SERVICE_TOKENS_JSON: ${MTC_SERVICE_TOKENS_JSON:-{"compose-smoke":"smoke-token"}}
      MTC_ALLOW_SMOKE_ASSETS: ${MTC_ALLOW_SMOKE_ASSETS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${MTC_API_PORT:-8000}:8000"
    volumes:
      - ${MTC_MODEL_DIR:-./models}:/models:ro
