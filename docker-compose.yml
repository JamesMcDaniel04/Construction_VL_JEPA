services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mtc
      POSTGRES_PASSWORD: mtc
      POSTGRES_DB: mtc
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtc"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MTC_MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
    environment:
      MTC_CONFIG: "${MTC_CONFIG:-/app/configs/production.yaml}"
      MTC_OBJECT_STORE_ACCESS_KEY: "${MTC_OBJECT_STORE_ACCESS_KEY:-minioadmin}"
      MTC_OBJECT_STORE_SECRET_KEY: "${MTC_OBJECT_STORE_SECRET_KEY:-minioadmin}"
      MTC_SERVICE_TOKENS_JSON: '${MTC_SERVICE_TOKENS_JSON:-{"compose-smoke":"smoke-token"}}'
      MTC_ALLOW_SMOKE_ASSETS: "${MTC_ALLOW_SMOKE_ASSETS:-0}"
      MTC_SUPABASE_PROJECT_URL: "${MTC_SUPABASE_PROJECT_URL:-}"
      MTC_SUPABASE_ANON_KEY: "${MTC_SUPABASE_ANON_KEY:-}"
      MTC_SUPABASE_SERVICE_ROLE_KEY: "${MTC_SUPABASE_SERVICE_ROLE_KEY:-}"
      MTC_SUPABASE_JWT_ISSUER: "${MTC_SUPABASE_JWT_ISSUER:-}"
      MTC_SUPABASE_JWT_AUDIENCE: "${MTC_SUPABASE_JWT_AUDIENCE:-authenticated}"
      MTC_SUPABASE_MOBILE_REDIRECT_SCHEME: "${MTC_SUPABASE_MOBILE_REDIRECT_SCHEME:-mtc://auth/callback}"
      MTC_SUPABASE_WEB_REDIRECT_URL: "${MTC_SUPABASE_WEB_REDIRECT_URL:-http://localhost:5173/auth/callback}"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${MTC_API_PORT:-8000}:8000"
    volumes:
      - ${MTC_MODEL_DIR:-./models}:/models:ro

  admin:
    image: node:20-bookworm-slim
    profiles: ["ui"]
    working_dir: /workspace
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_MTC_API_BASE_URL: "${VITE_MTC_API_BASE_URL:-http://localhost:8000}"
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
      VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY:-}"
      VITE_SUPABASE_WEB_REDIRECT_URL: "${VITE_SUPABASE_WEB_REDIRECT_URL:-http://localhost:5173/auth/callback}"
    command: >
      sh -lc "npm install && npm --workspace apps/admin run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${MTC_ADMIN_PORT:-5173}:5173"
    volumes:
      - .:/workspace

  mobile:
    image: node:20-bookworm-slim
    profiles: ["mobile"]
    working_dir: /workspace
    depends_on:
      api:
        condition: service_started
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_MTC_API_BASE_URL: "${EXPO_PUBLIC_MTC_API_BASE_URL:-http://localhost:8000}"
      EXPO_PUBLIC_SUPABASE_URL: "${EXPO_PUBLIC_SUPABASE_URL:-}"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}"
      EXPO_PUBLIC_SUPABASE_MOBILE_REDIRECT_URL: "${EXPO_PUBLIC_SUPABASE_MOBILE_REDIRECT_URL:-mtc://auth/callback}"
    command: >
      sh -lc "npm install && npm --workspace apps/mobile run start -- --non-interactive"
    ports:
      - "${MTC_EXPO_PORT:-8081}:8081"
      - "${MTC_EXPO_DEVTOOLS_PORT:-19000}:19000"
      - "${MTC_EXPO_MANIFEST_PORT:-19001}:19001"
    volumes:
      - .:/workspace

volumes:
  pg_data:
  qdrant_data:
  minio_data:
