services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mtc
      POSTGRES_PASSWORD: mtc
      POSTGRES_DB: mtc
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtc"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      retries: 5

  api:
    build:
      context: .
    environment:
      MTC_CONFIG: ${MTC_CONFIG:-/app/configs/production.yaml}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${MTC_API_PORT:-8000}:8000"
    volumes:
      - ${MTC_MODEL_DIR:-./models}:/models:ro

volumes:
  pg_data:
  qdrant_data:
