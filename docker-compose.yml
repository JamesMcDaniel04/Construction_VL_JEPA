version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mtc
      POSTGRES_PASSWORD: mtc
      POSTGRES_DB: mtc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtc"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      retries: 5

  api:
    build:
      context: .
    environment:
      MTC_CONFIG: /app/configs/default.yaml
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
