version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pfil
      POSTGRES_PASSWORD: pfil
      POSTGRES_DB: pfil
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfil"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      - PFIL_CONFIG=/app/configs/default.yaml
    depends_on:
      timescaledb:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # Uncomment when ready to run real-time pipeline:
  # ingestion:
  #   build:
  #     context: .
  #     target: ingestion
  #   environment:
  #     - PFIL_CONFIG=/app/configs/default.yaml
  #   command: ["--checkpoint", "/models/latest.ckpt"]
  #   depends_on:
  #     redpanda:
  #       condition: service_healthy
  #     api:
  #       condition: service_started

volumes:
  timescale_data:
  qdrant_data:
  mlflow_data:
